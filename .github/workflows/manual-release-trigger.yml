name: Manual Release Trigger

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g., v0.6.0)'
        required: true
        type: string

jobs:
  trigger-release:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger repository dispatch
        run: |
          gh api repos/${{ github.repository }}/dispatches \
            -X POST \
            -f event_type=publish-release \
            -f "client_payload[tag_name]=${{ inputs.tag_name }}"
        env:
          GH_TOKEN: ${{ github.token }}
