name: CRAN Release

# Simplified CRAN submission workflow
# All validation and dry-runs happen on private repo (publish-to-public.yml)
# This workflow only handles the final CRAN submission on the public repo

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers when publish-to-public pushes a version tag
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: write
  packages: read

jobs:
  # Stage 5: Final CRAN submission - requires approval
  submit-to-cran:
    name: "Stage 5: Submit to CRAN (Final Approval)"
    # Only run on public repository
    if: github.repository == 'ericscheier/emburden'
    runs-on: ubuntu-latest
    environment: cran-production  # Requires manual approval

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: get_version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(grep "^Version:" DESCRIPTION | sed 's/^Version: *//')
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Found version: $VERSION"

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Install devtools
        run: Rscript -e "install.packages('devtools')"

      - name: Build source package
        id: build
        run: |
          R CMD build . | tee /tmp/build-output.txt
          tarball=$(grep -o '[^/]*\.tar\.gz$' /tmp/build-output.txt)
          echo "tarball=$tarball" >> $GITHUB_OUTPUT
          echo "Built package: $tarball"

      - name: Prepare CRAN submission
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          TARBALL="${{ steps.build.outputs.tarball }}"

          cat > cran_comments.md << EOF
          ## Resubmission
          This is version $VERSION of the emburden package.

          ## Test environments
          * Ubuntu 22.04 (GitHub Actions), R-release
          * Windows (GitHub Actions), R-release
          * macOS (GitHub Actions), R-release

          ## R CMD check results
          There were no ERRORs, WARNINGs, or NOTEs.

          ## Downstream dependencies
          There are currently no downstream dependencies for this package.
          EOF

          echo "Package: emburden v$VERSION" >> $GITHUB_STEP_SUMMARY
          echo "Tarball: $TARBALL" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### CRAN Submission Comments" >> $GITHUB_STEP_SUMMARY
          cat cran_comments.md >> $GITHUB_STEP_SUMMARY

      - name: Submit to CRAN
        env:
          CRAN_EMAIL: ${{ secrets.CRAN_EMAIL }}
        run: |
          TARBALL="${{ steps.build.outputs.tarball }}"
          VERSION="${{ steps.get_version.outputs.version }}"

          echo "🚀 STAGE 5: Submitting to CRAN (Final Approval Granted)"
          echo ""
          echo "================================"
          echo "  CRAN Submission"
          echo "================================"
          echo ""
          echo "Package: emburden v$VERSION"
          echo "Tarball: $TARBALL"
          echo "Email: $CRAN_EMAIL"
          echo "Repository: Public (ericscheier/emburden)"
          echo ""
          echo "📋 Complete Pipeline Status:"
          echo "  ✅ Stage 1: Full CRAN validation (private repo)"
          echo "  ✅ Stage 2: Testing dry-run (private repo)"
          echo "  ✅ Stage 3: Production dry-run (private repo, approved)"
          echo "  ✅ Stage 4: Published to public repo"
          echo "  ✅ Stage 5: Final approval granted (current)"
          echo ""
          echo "📧 Submitting to CRAN now..."
          echo ""

          # Auto-submit to CRAN using configured CRAN_EMAIL
          Rscript -e "devtools::submit_cran('$TARBALL', email = Sys.getenv('CRAN_EMAIL'))"

          echo ""
          echo "✅ Package submitted to CRAN!"
          echo "📬 Check $CRAN_EMAIL for CRAN submission confirmation"

      - name: Upload tarball to release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          TARBALL="${{ steps.build.outputs.tarball }}"
          TAG="v$VERSION"

          echo "📦 Uploading CRAN-submitted tarball to release $TAG..."

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists, uploading tarball..."
            gh release upload "$TAG" "$TARBALL" --clobber
            echo "✅ Uploaded $TARBALL to release $TAG"
          else
            echo "⚠️  Release $TAG does not exist yet"
            echo "Skipping tarball upload"
          fi

      - name: Post-submission summary
        if: always()
        run: |
          echo "### Stage 5: CRAN Submission Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Package Submitted to CRAN**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Complete Pipeline:**" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Stage 1: Full CRAN validation (private repo)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Stage 2: Testing dry-run (private repo)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Stage 3: Production dry-run (private repo, approved)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Stage 4: Published to public repo" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Stage 5: Submitted to CRAN (public repo, approved)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next steps:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Wait for CRAN submission confirmation email" >> $GITHUB_STEP_SUMMARY
          echo "2. Respond to any CRAN reviewer feedback" >> $GITHUB_STEP_SUMMARY
          echo "3. Monitor https://cran.r-project.org/web/checks/" >> $GITHUB_STEP_SUMMARY
