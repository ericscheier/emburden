name: Validate Workflows

# Validates GitHub Actions workflow files for syntax errors
# Prevents YAML parsing errors from reaching production
# Runs on all branches (dev, staging, main)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

# Cancel in-progress runs when a new run is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Workflow Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install actionlint
        run: |
          echo "Installing actionlint..."
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          sudo mv ./actionlint /usr/local/bin/
          actionlint --version

      - name: Validate workflow files
        run: |
          echo "## Workflow Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Run actionlint on all workflow files
          # Skip workflows with heredocs/template literals that cause actionlint false positives
          # Also skip deprecated workflows (intentionally disabled with if: false)
          # Disable shellcheck integration (only validate YAML syntax, not bash style)
          SKIP_PATTERN="auto-release.yml\|promote-to-staging.yml\|promote-to-main.yml\|auto-approve-safe-changes.yml\|auto-tag-on-version-bump.yml\|auto-merge-version-bumps.yml"
          if find .github/workflows -name "*.yml" -o -name "*.yaml" | grep -v "$SKIP_PATTERN" | xargs actionlint -color -shellcheck=""; then
            echo "✅ All workflow files passed validation" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Files validated:**" >> $GITHUB_STEP_SUMMARY
            find .github/workflows -name "*.yml" -o -name "*.yaml" 2>/dev/null | grep -v "$SKIP_PATTERN" | while read -r file; do
              basename "$file" | sed 's/^/- `/' | sed 's/$/`/' >> $GITHUB_STEP_SUMMARY
            done
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Note:** Skipped workflows:" >> $GITHUB_STEP_SUMMARY
            echo "- Heredocs/template literals: auto-release.yml, promote-to-staging.yml, promote-to-main.yml, auto-approve-safe-changes.yml" >> $GITHUB_STEP_SUMMARY
            echo "- Deprecated workflows: auto-tag-on-version-bump.yml, auto-merge-version-bumps.yml" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Workflow validation failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Error Details:**" >> $GITHUB_STEP_SUMMARY
            echo "See job logs for specific errors." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Check for common YAML issues
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Additional YAML Checks" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check for potential YAML document separators in heredocs
          if grep -rn "cat.*<<.*\-\-\-" .github/workflows/ || \
             grep -rn "cat.*<<.*\*\*\*" .github/workflows/; then
            echo "⚠️  **Warning**: Found potential YAML document separators (\`---\` or \`***\`) in bash heredocs" >> $GITHUB_STEP_SUMMARY
            echo "These can cause YAML parsing errors. Use \`___\` (underscores) instead." >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No YAML document separator issues found in heredocs" >> $GITHUB_STEP_SUMMARY
          fi
