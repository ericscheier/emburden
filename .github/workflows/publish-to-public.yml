name: Publish to Public Repository

# Trigger options:
# 1. On GitHub release published (automatic after auto-release.yaml creates release)
# 2. On push to 'ready-for-public' branch (create this branch with protections)
# 3. Manual trigger via GitHub Actions UI
#
# NOTE: We trigger on 'release' events instead of 'push: tags' because
# the auto-release workflow uses GITHUB_TOKEN to push tags, which won't
# trigger other workflows (GitHub security feature to prevent infinite loops).
# By triggering on 'release' events, we run automatically when the GitHub
# release is created.

# Force re-index: 2025-12-10

on:
  repository_dispatch:  # Alternative trigger via repository dispatch API
    types: [publish-release]
  release:
    types: [published]  # Triggers when promote-to-main creates a GitHub release on main
  workflow_call:  # Called by other workflows
    inputs:
      tag_name:
        required: true
        type: string
  pull_request:  # Validate workflow changes on all branches
    branches:
      - dev
      - staging
      - main
    paths:
      - '.github/workflows/publish-to-public.yml'
  workflow_dispatch:    # Manual trigger from GitHub UI
    inputs:
      tag_name:
        description: 'Tag name (e.g., v0.5.13) - optional, defaults to current HEAD'
        required: false
        type: string

env:
  PUBLIC_REPO: 'ericscheier/emburden'
  PUBLIC_BRANCH: 'main'

jobs:
  # Stage 1: Full CRAN validation with vignettes on private repo
  validate-cran:
    name: "Stage 1: CRAN Validation (Private Repo)"
    runs-on: ubuntu-latest
    # Run on:
    # - PRs (to validate changes before merge)
    # - Releases with version tags (for deployment)
    # - Manual dispatch with version tags
    # - Repository dispatch events
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'repository_dispatch' ||
      (github.event.release.tag_name != '' && startsWith(github.event.release.tag_name, 'v')) ||
      (inputs.tag_name != '' && startsWith(inputs.tag_name, 'v'))

    outputs:
      version: ${{ steps.get_version.outputs.version }}
      tarball: ${{ steps.build.outputs.tarball }}
      tag_name: ${{ steps.tag.outputs.tag_name }}

    steps:
      - name: Detect tag
        id: tag
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG=""
          fi
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT
          if [ -n "$TAG" ]; then
            echo "Validating tag: $TAG"
          else
            echo "No tag (PR or untagged run)"
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag_name || github.head_ref }}
          fetch-depth: 0

      - name: Extract version
        id: get_version
        run: |
          TAG="${{ steps.tag.outputs.tag_name }}"
          if [ -n "$TAG" ]; then
            # Extract from tag for releases
            VERSION=${TAG#v}
            echo "Using version from tag: $VERSION"
          else
            # Extract from DESCRIPTION for PRs
            VERSION=$(grep "^Version:" DESCRIPTION | awk '{print $2}')
            echo "Using version from DESCRIPTION: $VERSION"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Found version: $VERSION"

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Setup R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::devtools
          needs: check

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Setup TinyTeX
        uses: r-lib/actions/setup-tinytex@v2
        env:
          TINYTEX_INSTALLER: TinyTeX

      - name: Build source package
        id: build
        run: |
          echo "📦 Building R package..."
          echo "Working directory: $(pwd)"
          echo "DESCRIPTION file exists: $(test -f DESCRIPTION && echo 'yes' || echo 'no')"

          # Run R CMD build with explicit error checking
          set -e  # Exit on any error
          set -o pipefail  # Catch errors in pipes

          echo ""
          echo "Running: R CMD build --compact-vignettes=gs+qpdf ."
          R CMD build --compact-vignettes=gs+qpdf . 2>&1 | tee /tmp/build-output.txt
          BUILD_EXIT=$?

          echo ""
          echo "Build exit code: $BUILD_EXIT"

          if [ $BUILD_EXIT -ne 0 ]; then
            echo "❌ R CMD build failed with exit code $BUILD_EXIT"
            echo "Build output:"
            cat /tmp/build-output.txt
            exit $BUILD_EXIT
          fi

          echo "✅ Build succeeded, extracting tarball name..."
          echo "Build output:"
          cat /tmp/build-output.txt
          echo ""

          # Extract tarball name from build output
          # Expected format: "* building 'packagename_version.tar.gz'"
          # Using simple regex that works with standard grep (no -P needed)
          # tail -1 ensures we get the last (newest) match if there are multiple
          tarball=$(grep -o "[a-zA-Z0-9._-]*\.tar\.gz" /tmp/build-output.txt | tail -1 || true)

          if [ -z "$tarball" ]; then
            echo "❌ ERROR: Could not extract tarball name from build output"
            echo ""
            echo "This likely means the build output format has changed."
            echo "Please review the full output above and update the extraction pattern."
            echo ""
            echo "Expected line format: * building 'packagename_version.tar.gz'"
            echo ""
            echo "Directory contents:"
            ls -la *.tar.gz 2>/dev/null || echo "No .tar.gz files found"
            exit 1
          fi

          # Verify tarball exists
          if [ ! -f "$tarball" ]; then
            echo "❌ ERROR: Extracted tarball does not exist: $tarball"
            echo ""
            echo "Build output indicated tarball name: $tarball"
            echo "But the file was not found in the working directory."
            echo ""
            echo "Directory contents:"
            ls -la
            exit 1
          fi

          echo "tarball=$tarball" >> $GITHUB_OUTPUT
          echo "✅ Built package: $tarball"
          echo "📊 Tarball size: $(du -h "$tarball" | cut -f1)"

      - name: Run CRAN checks (full build with vignettes)
        run: |
          echo "🔍 STAGE 1: Full CRAN validation on private repo (with vignettes)"

          # For PRs: only fail on errors (warnings are informational)
          # For releases: fail on warnings (strict CRAN compliance)
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            ERROR_LEVEL="error"
            echo "📝 PR mode: Will only fail on ERRORs, warnings are informational"
          else
            ERROR_LEVEL="warning"
            echo "🎯 Release mode: Will fail on WARNINGs (strict CRAN compliance)"
          fi

          Rscript -e "rcmdcheck::rcmdcheck(
            path = '${{ steps.build.outputs.tarball }}',
            args = c('--as-cran', '--no-manual'),
            error_on = '$ERROR_LEVEL',
            check_dir = 'check'
          )"

      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: private-cran-check-results
          path: check/

      - name: Upload source tarball
        uses: actions/upload-artifact@v4
        with:
          name: r-package-source
          path: ${{ steps.build.outputs.tarball }}
          retention-days: 30

      - name: Submit to Win-builder (Optional)
        id: winbuilder
        continue-on-error: true
        run: |
          echo "📦 Submitting to Win-builder for Windows testing..."
          Rscript -e "devtools::check_win_release(email = '${{ secrets.CRAN_EMAIL }}')"
          echo "✅ Submitted to Win-builder!"

  # Stage 2: Testing dry-run - runs automatically after validation
  dry-run-test:
    name: "Stage 2: Testing Dry-Run (Private Repo)"
    needs: validate-cran
    if: success() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: cran-testing  # No approval required

    steps:
      - name: Download package tarball
        uses: actions/download-artifact@v4
        with:
          name: r-package-source

      - name: Dry-run validation
        env:
          CRAN_EMAIL: ${{ secrets.CRAN_EMAIL }}
        run: |
          VERSION="${{ needs.validate-cran.outputs.version }}"
          TARBALL="${{ needs.validate-cran.outputs.tarball }}"

          echo "🔍 STAGE 2: Testing Dry-Run (Private Repo)"
          echo ""
          echo "Package: emburden v$VERSION"
          echo "Tarball: $TARBALL"
          echo "Email: $CRAN_EMAIL"
          echo ""
          echo "✅ Package validated successfully"
          echo "✅ Vignettes built successfully"
          echo "✅ All checks passed"
          echo ""
          echo "📋 Sequential Pipeline Progress:"
          echo "  ✅ Stage 1: Full CRAN validation complete (with vignettes)"
          echo "  ✅ Stage 2: Testing dry-run complete (current)"
          echo "  ⏳ Stage 3: Production dry-run (requires approval)"
          echo "  ⏳ Stage 4: Publish to public repo (automatic after approval)"

  # Stage 3: Production dry-run - requires approval before publishing
  dry-run-prod:
    name: "Stage 3: Production Dry-Run (Approval Required)"
    needs: [validate-cran, dry-run-test]
    if: success() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: cran-production  # Requires manual approval

    steps:
      - name: Download package tarball
        uses: actions/download-artifact@v4
        with:
          name: r-package-source

      - name: Production dry-run preview
        env:
          CRAN_EMAIL: ${{ secrets.CRAN_EMAIL }}
        run: |
          VERSION="${{ needs.validate-cran.outputs.version }}"
          TARBALL="${{ needs.validate-cran.outputs.tarball }}"

          echo "🔍 STAGE 3: Production Dry-Run (Approval Granted)"
          echo ""
          echo "Package: emburden v$VERSION"
          echo "Tarball: $TARBALL"
          echo "Email: $CRAN_EMAIL"
          echo "Environment: cran-production (private repo)"
          echo ""
          echo "✅ Package validated successfully"
          echo "✅ Vignettes built successfully"
          echo "✅ All checks passed"
          echo "✅ Production approval granted"
          echo ""
          echo "📋 Sequential Pipeline Progress:"
          echo "  ✅ Stage 1: Full CRAN validation complete"
          echo "  ✅ Stage 2: Testing dry-run complete"
          echo "  ✅ Stage 3: Production dry-run complete (current)"
          echo "  ⏳ Stage 4: Publish to public repo (ready to proceed)"
          echo ""
          echo "📌 Ready to publish to public repository!"

  # Stage 4: Publish to public repo - only after all validation and approval
  publish:
    name: "Stage 4: Publish to Public Repository"
    runs-on: ubuntu-latest
    needs: [validate-cran, dry-run-prod]
    # Run if all previous stages succeeded OR if not a version tag (skip validation for branch pushes)
    # NEVER run on pull_request events
    if: |
      github.event_name != 'pull_request' &&
      always() &&
      (needs.dry-run-prod.result == 'success' || needs.validate-cran.result == 'skipped')
    environment:
      name: public-release
      url: https://github.com/${{ env.PUBLIC_REPO }}

    steps:
      - name: Detect tag name from input or event
        id: detect_tag
        run: |
          # Priority: workflow_dispatch/workflow_call input > tag event > branch
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG_NAME="${{ inputs.tag_name }}"
            echo "Source: workflow input"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_NAME=${GITHUB_REF#refs/tags/}
            echo "Source: tag event"
          else
            TAG_NAME=""
            echo "Source: branch (no tag)"
          fi

          IS_TAG=false
          IS_VERSION_TAG=false
          if [ -n "$TAG_NAME" ]; then
            IS_TAG=true
            case "$TAG_NAME" in
              v*) IS_VERSION_TAG=true ;;
            esac
          fi

          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "is_tag=$IS_TAG" >> "$GITHUB_OUTPUT"
          echo "is_version_tag=$IS_VERSION_TAG" >> "$GITHUB_OUTPUT"

          echo "tag_name=$TAG_NAME"
          echo "is_tag=$IS_TAG"
          echo "is_version_tag=$IS_VERSION_TAG"

      # Architecture: build a SINGLE new commit on top of public main with a
      # tree matching the cleaned private content, then fast-forward push.
      # This avoids history rewriting (which produced no-common-ancestor
      # branches that can't be merged) and force-pushing (which is blocked
      # by the public repo's branch protection).

      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.detect_tag.outputs.tag_name || github.ref }}
          path: private
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout public repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PUBLIC_REPO }}
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          ref: ${{ env.PUBLIC_BRANCH }}
          path: public
          fetch-depth: 1

      - name: Sync private content into public working tree
        run: |
          set -euo pipefail

          echo "Replacing public tree with cleaned private content..."

          # Wipe everything in public/ except .git
          find public -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +

          # Copy everything from private/ into public/ EXCEPT private's .git
          # (rsync handles trailing-slash semantics correctly)
          rsync -a --exclude='.git' private/ public/

          echo "Cleaning files that should not be on the public repo..."
          cd public

          # Remove .private/ directory
          rm -rf .private/

          # Remove log files
          find . -name "*.log" -type f -delete 2>/dev/null || true

          # Remove cache and output directories
          find . -name "*_cache" -type d -exec rm -rf {} + 2>/dev/null || true
          find . -name "*_files" -type d -exec rm -rf {} + 2>/dev/null || true

          # Remove private-only workflow files (release-pipeline plumbing)
          rm -f .github/workflows/publish-to-public.yml
          rm -f .github/workflows/auto-release.yml
          rm -f .github/workflows/auto-release.yaml
          rm -f .github/workflows/auto-tag-on-version-bump.yml
          rm -f .github/workflows/promote-to-main.yml
          rm -f .github/workflows/promote-to-staging.yml
          rm -f .github/workflows/auto-merge-version-bumps.yml
          rm -f .github/workflows/auto-approve-safe-changes.yml

          echo ""
          echo "Public tree after sync + cleanup:"
          ls -la
          echo ""
          echo "Files staged for the release commit:"
          git status --short | head -50

      - name: Commit and push to public main
        id: push_public
        env:
          TAG_NAME: ${{ steps.detect_tag.outputs.tag_name }}
        run: |
          set -euo pipefail
          cd public

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # If there's nothing to commit, exit early
          if git diff --cached --quiet && git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes to publish — public main already matches cleaned private content."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add -A

          # Compose the commit message
          if [ -n "$TAG_NAME" ]; then
            COMMIT_TITLE="Release ${TAG_NAME}"
          else
            COMMIT_TITLE="Sync from private repository ($(date -u +%Y-%m-%d))"
          fi

          # Append release notes from NEWS.md if available
          {
            echo "$COMMIT_TITLE"
            echo
            echo "Published from ScheierVentures/emburden (private)."
            if [ -n "$TAG_NAME" ] && [ -f "NEWS.md" ]; then
              VERSION=${TAG_NAME#v}
              echo
              awk "/^# emburden $VERSION/,/^# emburden [0-9]/" NEWS.md | head -n -1 || true
            fi
          } > /tmp/release_commit_msg.txt

          git commit -F /tmp/release_commit_msg.txt
          echo "committed=true" >> "$GITHUB_OUTPUT"

          # Push to public main as a normal fast-forward (no --force needed).
          git push origin "${PUBLIC_BRANCH}"

          echo ""
          echo "================================================================"
          echo "  Pushed to ${PUBLIC_REPO}:${PUBLIC_BRANCH}"
          echo "================================================================"

      - name: Push tag to public repository
        if: steps.detect_tag.outputs.is_version_tag == 'true' && steps.push_public.outputs.committed == 'true'
        run: |
          set -euo pipefail
          cd public
          TAG_NAME="${{ steps.detect_tag.outputs.tag_name }}"
          echo "Tagging public HEAD as: ${TAG_NAME}"

          # If the tag already exists on the remote (e.g. prior failed run),
          # delete it first so we can retag at the new HEAD. Branch
          # protection covers branches, not tags, so force-update on tags
          # is acceptable.
          git push origin --delete "${TAG_NAME}" 2>/dev/null || true

          git tag -f "${TAG_NAME}"
          git push origin "${TAG_NAME}"

      - name: Create GitHub release on public repo
        if: steps.detect_tag.outputs.is_version_tag == 'true' && steps.push_public.outputs.committed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          GH_REPO: ${{ env.PUBLIC_REPO }}
        run: |
          # Extract version from detected tag
          TAG_NAME="${{ steps.detect_tag.outputs.tag_name }}"
          VERSION=${TAG_NAME#v}

          echo "Creating release for version: $VERSION"

          # Extract release notes from the public-tree NEWS.md
          if [ -f "public/NEWS.md" ]; then
            # Extract the section for this version
            awk "/^# emburden $VERSION/,/^# emburden [0-9]/" public/NEWS.md | head -n -1 > /tmp/release-notes.md

            # If no release notes found, use a default message
            if [ ! -s /tmp/release-notes.md ]; then
              echo "Release notes not found in NEWS.md for version $VERSION" > /tmp/release-notes.md
            fi
          else
            echo "Release notes not available (NEWS.md not found)" > /tmp/release-notes.md
          fi

          # Append installation and citation information
          cat >> /tmp/release-notes.md <<EOF

          ---

          ## Installation

          \`\`\`r
          # Install from GitHub
          # install.packages("remotes")
          remotes::install_github("${PUBLIC_REPO}@${TAG_NAME}")
          \`\`\`

          ## Citation

          If you use this package or methodology in your research, please cite:

          **Scheier, E., & Kittner, N. (2022). A measurement strategy to address disparities across household energy burdens. _Nature Communications_, 13, 1717. https://doi.org/10.1038/s41467-021-27673-y**
          EOF

          # Create the release on public repo
          gh release create "${TAG_NAME}" \
            --repo "${PUBLIC_REPO}" \
            --title "emburden ${TAG_NAME}" \
            --notes-file /tmp/release-notes.md \
            --verify-tag

          echo ""
          echo "✅ GitHub release created: https://github.com/${PUBLIC_REPO}/releases/tag/${TAG_NAME}"

      - name: Summary
        run: |
          echo "## Publication Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Successfully published to [\`${PUBLIC_REPO}\`](https://github.com/${PUBLIC_REPO})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Target branch:** \`${PUBLIC_BRANCH}\`" >> $GITHUB_STEP_SUMMARY

          if [ -n "${{ steps.detect_tag.outputs.tag_name }}" ]; then
            TAG_NAME="${{ steps.detect_tag.outputs.tag_name }}"
            echo "**Tag:** \`${TAG_NAME}\`" >> $GITHUB_STEP_SUMMARY

            # If this is a version tag, include release link
            if [[ "$TAG_NAME" == v* ]]; then
              echo "**Release:** [${TAG_NAME}](https://github.com/${PUBLIC_REPO}/releases/tag/${TAG_NAME})" >> $GITHUB_STEP_SUMMARY
            fi
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Cleaned items:" >> $GITHUB_STEP_SUMMARY
          echo "- \`.private/\` directory" >> $GITHUB_STEP_SUMMARY
          echo "- \`*.log\` files" >> $GITHUB_STEP_SUMMARY
          echo "- \`*_cache/\` directories" >> $GITHUB_STEP_SUMMARY
          echo "- \`*_files/\` directories" >> $GITHUB_STEP_SUMMARY
          echo "- Workflow files" >> $GITHUB_STEP_SUMMARY
          echo "- AI attributions from commit messages" >> $GITHUB_STEP_SUMMARY

