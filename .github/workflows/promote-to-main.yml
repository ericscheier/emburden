name: Promote Staging to Main (Production Release)

# Production release workflow: staging → main
# Validates staging, bumps version, creates PR, requires manual approval
# After merge, triggers publish-to-public and cran-release workflows

on:
  workflow_dispatch:  # Manual trigger only
    inputs:
      version_bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - 'patch'
          - 'minor'
          - 'major'
          - 'custom'
      custom_version:
        description: 'Custom version (only if version_bump=custom)'
        required: false
        type: string
      skip_checks:
        description: 'Skip CI checks (emergency only)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  # Validate staging branch before promotion
  validate-staging:
    name: "Validate Staging Branch"
    runs-on: ubuntu-latest
    if: github.repository == 'ScheierVentures/emburden' && inputs.skip_checks != 'true'

    outputs:
      staging_sha: ${{ steps.get_sha.outputs.staging_sha }}
      staging_short_sha: ${{ steps.get_sha.outputs.staging_short_sha }}
      current_version: ${{ steps.get_version.outputs.current_version }}
      new_version: ${{ steps.calculate_version.outputs.new_version }}

    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Get staging branch SHA
        id: get_sha
        run: |
          STAGING_SHA=$(git rev-parse HEAD)
          STAGING_SHORT_SHA=$(git rev-parse --short HEAD)
          echo "staging_sha=$STAGING_SHA" >> $GITHUB_OUTPUT
          echo "staging_short_sha=$STAGING_SHORT_SHA" >> $GITHUB_OUTPUT
          echo "Staging branch SHA: $STAGING_SHA"

      - name: Get current version
        id: get_version
        run: |
          CURRENT_VERSION=$(grep "^Version:" DESCRIPTION | sed 's/Version: //')
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT_VERSION"

      - name: Calculate new version
        id: calculate_version
        run: |
          CURRENT_VERSION="${{ steps.get_version.outputs.current_version }}"
          BUMP_TYPE="${{ inputs.version_bump }}"
          CUSTOM_VERSION="${{ inputs.custom_version }}"

          if [[ "$BUMP_TYPE" == "custom" ]]; then
            if [[ -z "$CUSTOM_VERSION" ]]; then
              echo "❌ Error: custom version specified but no custom_version provided"
              exit 1
            fi
            NEW_VERSION="$CUSTOM_VERSION"
          else
            # Parse current version
            if [[ "$CURRENT_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(\..*)?$ ]]; then
              MAJOR="${BASH_REMATCH[1]}"
              MINOR="${BASH_REMATCH[2]}"
              PATCH="${BASH_REMATCH[3]}"

              case "$BUMP_TYPE" in
                major)
                  NEW_VERSION="$((MAJOR + 1)).0.0"
                  ;;
                minor)
                  NEW_VERSION="${MAJOR}.$((MINOR + 1)).0"
                  ;;
                patch)
                  NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
                  ;;
                *)
                  echo "❌ Error: Invalid bump type: $BUMP_TYPE"
                  exit 1
                  ;;
              esac
            else
              echo "❌ Error: Could not parse version: $CURRENT_VERSION"
              exit 1
            fi
          fi

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "📦 Version bump: $CURRENT_VERSION → $NEW_VERSION (type: $BUMP_TYPE)"

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Setup R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Run R CMD check on staging
        run: |
          echo "🔍 Running R CMD check on staging branch..."
          Rscript -e "rcmdcheck::rcmdcheck(
            args = c('--no-manual', '--as-cran'),
            error_on = 'warning',
            check_dir = 'check'
          )"

      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: staging-check-results
          path: check/

  # Multi-platform validation (runs in parallel with ubuntu check above)
  validate-multiplatform:
    name: "Multi-Platform Validation"
    runs-on: ${{ matrix.os }}
    if: github.repository == 'ScheierVentures/emburden' && inputs.skip_checks != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: staging

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Setup R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Run R CMD check
        run: |
          Rscript -e "rcmdcheck::rcmdcheck(
            args = c('--no-manual'),
            error_on = 'warning',
            check_dir = 'check'
          )"

      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-check-results
          path: check/

  # Create promotion PR with version bump
  create-release-pr:
    name: "Create Production Release PR"
    needs: [validate-staging, validate-multiplatform]
    if: |
      always() &&
      (needs.validate-staging.result == 'success' || inputs.skip_checks == 'true') &&
      (needs.validate-multiplatform.result == 'success' || inputs.skip_checks == 'true')
    runs-on: ubuntu-latest

    outputs:
      pr_number: ${{ steps.create_pr.outputs.pr_number }}

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Create release branch
        id: create_branch
        run: |
          TIMESTAMP=$(date -u +"%Y%m%d-%H%M%S")
          NEW_VERSION="${{ needs.validate-staging.outputs.new_version || inputs.custom_version }}"
          BRANCH_NAME="release/v${NEW_VERSION}"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

          # Create release branch from main
          git checkout -b "$BRANCH_NAME"

          # Merge staging into release branch
          git fetch origin staging:staging
          git merge --no-ff staging -m "chore: Promote staging to main - Release v${NEW_VERSION}"

          echo "Created release branch: $BRANCH_NAME"

      - name: Bump version
        id: bump_version
        run: |
          NEW_VERSION="${{ steps.create_branch.outputs.new_version }}"

          echo "🔧 Bumping version to $NEW_VERSION using release-version.sh..."

          # Run version bump script in auto mode (no interactive prompts)
          # This updates DESCRIPTION, CITATION, .zenodo.json, and NEWS.md
          bash .dev/release-version.sh "$NEW_VERSION" --auto

          echo "✅ Version bumped successfully"

      - name: Amend merge commit with version bump
        run: |
          NEW_VERSION="${{ steps.create_branch.outputs.new_version }}"

          # Stage version files
          git add DESCRIPTION inst/CITATION .zenodo.json NEWS.md

          # Amend the merge commit to include version bump
          git commit --amend --no-edit

          echo "✅ Merge commit amended with version bump"

      - name: Push release branch
        run: |
          BRANCH_NAME="${{ steps.create_branch.outputs.branch_name }}"
          git push origin "$BRANCH_NAME"
          echo "✅ Pushed release branch: $BRANCH_NAME"

      - name: Create pull request
        id: create_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="${{ steps.create_branch.outputs.branch_name }}"
          NEW_VERSION="${{ steps.create_branch.outputs.new_version }}"
          CURRENT_VERSION="${{ needs.validate-staging.outputs.current_version || 'N/A' }}"
          STAGING_SHA="${{ needs.validate-staging.outputs.staging_sha || 'N/A' }}"
          STAGING_SHORT_SHA="${{ needs.validate-staging.outputs.staging_short_sha || 'N/A' }}"
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          # Get commits between main and staging
          COMMITS=$(git log main..staging --oneline --no-merges | head -20)
          COMMIT_COUNT=$(git rev-list --count main..staging)

          # Extract NEWS.md entry for this version
          NEWS_CONTENT=""
          if [[ -f NEWS.md ]]; then
            NEWS_CONTENT=$(awk "/^# emburden $NEW_VERSION/,/^(# emburden|---)/ {
              if (\$0 !~ /^(# emburden|---)/) print
            }" NEWS.md | sed 's/^## /### /')
          fi

          # Create PR body (without single quotes to allow variable expansion)
          cat > pr_body.md << EOFBODY
## 🚀 Production Release v$NEW_VERSION

- **Release timestamp:** $TIMESTAMP
- **Version bump:** $CURRENT_VERSION → **$NEW_VERSION**
- **Staging SHA:** \`$STAGING_SHORT_SHA\` (\`$STAGING_SHA\`)
- **Commits included:** $COMMIT_COUNT

---

### 📋 Release Notes

$NEWS_CONTENT

---

### 📦 Changes in this release

\`\`\`
$COMMITS
\`\`\`

---

### ✅ Pre-release validation

- ✅ Staging R CMD check: **PASSED**
- ✅ Multi-platform checks (ubuntu, windows, macos): **PASSED**
- ✅ All staging CI checks: **PASSED**
- ✅ Version bumped: DESCRIPTION, CITATION, .zenodo.json, NEWS.md

---

### 🔐 Required approvals

This production release requires:
1. ✅ Manual code review approval
2. ✅ Manual approval via \`production-release\` environment
3. ✅ All main branch CI checks must pass

---

### 🎯 What happens after approval and merge?

1. **Version tag created:** \`v$NEW_VERSION\` on main branch
2. **GitHub release:** Auto-created with changelog from NEWS.md
3. **Publish to public repo:** Workflow syncs main branch to \`ericscheier/emburden\`
4. **CRAN release:** Workflow triggers on public repo (requires final manual approval)

---

### ⚠️ IMPORTANT

**This is a production release.** Review all changes carefully before approving.

Once merged to main:
- Public repository will be updated
- CRAN submission workflow will be triggered
- Version tag will be permanent

**Do not approve unless:**
- All changes have been thoroughly tested in staging
- Documentation is complete and accurate
- Breaking changes are clearly documented
- You are ready for public release and CRAN submission
EOFBODY

          # Substitute variables
          sed -i "s/\$TIMESTAMP/$TIMESTAMP/g" pr_body.md
          sed -i "s/\$NEW_VERSION/$NEW_VERSION/g" pr_body.md
          sed -i "s/\$CURRENT_VERSION/$CURRENT_VERSION/g" pr_body.md
          sed -i "s/\$STAGING_SHA/$STAGING_SHA/g" pr_body.md
          sed -i "s/\$STAGING_SHORT_SHA/$STAGING_SHORT_SHA/g" pr_body.md
          sed -i "s/\$COMMIT_COUNT/$COMMIT_COUNT/g" pr_body.md
          sed -i "s/\$COMMITS/$COMMITS/g" pr_body.md
          sed -i "s/\$NEWS_CONTENT/$NEWS_CONTENT/g" pr_body.md

          # Create PR
          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "🚀 Release v${NEW_VERSION}" \
            --body-file pr_body.md \
            --label "release" \
            --label "production")

          # Extract PR number
          PR_NUMBER=$(echo "$PR_URL" | grep -o '[0-9]*$')
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT

          echo "Created production release PR: $PR_URL"
          echo "PR Number: $PR_NUMBER"

      - name: Add release checklist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ steps.create_pr.outputs.pr_number }}"
          NEW_VERSION="${{ steps.create_branch.outputs.new_version }}"

          gh pr comment "$PR_NUMBER" --body "$(cat <<'EOF'
### 📋 Production Release Checklist

Before approving this release, verify:

#### Code Quality
- [ ] All changes have been reviewed and tested in staging
- [ ] All CI checks pass (ubuntu, windows, macos)
- [ ] Code coverage is maintained or improved
- [ ] No security vulnerabilities introduced

#### Documentation
- [ ] NEWS.md accurately describes all changes
- [ ] README.md is up to date
- [ ] Vignettes reflect current functionality
- [ ] Function documentation is complete and accurate

#### Version Management
- [ ] Version number follows semantic versioning
- [ ] DESCRIPTION, CITATION, and .zenodo.json are synchronized
- [ ] Version bump is appropriate (patch/minor/major)

#### Release Readiness
- [ ] Breaking changes are clearly documented (if any)
- [ ] Deprecation warnings are in place (if applicable)
- [ ] All known bugs are resolved or documented
- [ ] CRAN submission is desired at this time

---

### 🎯 Approval Process

1. **Review:** Check all changes in this PR
2. **Verify:** All CI status checks are green
3. **Approve:** GitHub PR review approval
4. **Environment:** Approve via \`production-release\` environment gate
5. **Auto-merge:** PR merges automatically after approval

---

### 📦 Post-Merge Automation

After merge, the following will happen automatically:

1. ✅ Version tag \`v$NEW_VERSION\` created on main
2. ✅ GitHub release created with NEWS.md content
3. ✅ Publish-to-public workflow syncs to public repo
4. ⏳ CRAN release workflow runs (requires your final approval)

---

**Questions or concerns?** Leave a comment before approving.
EOF
          )" | sed "s/\$NEW_VERSION/$NEW_VERSION/g"

  # Wait for approval and auto-merge
  auto-merge-release:
    name: "Auto-Merge Production Release"
    needs: [create-release-pr, validate-staging]
    runs-on: ubuntu-latest
    environment: production-release  # Requires manual approval

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ needs.create-release-pr.outputs.pr_number }}"

          echo "🔄 Enabling auto-merge for production release PR #$PR_NUMBER..."

          # Enable auto-merge with merge commit strategy (preserve full history)
          gh pr merge "$PR_NUMBER" --auto --merge --delete-branch

          echo "✅ Auto-merge enabled. PR will merge automatically after:"
          echo "   - All status checks pass"
          echo "   - Required reviews are approved"
          echo "   - production-release environment approval granted"

      - name: Wait for merge
        run: |
          PR_NUMBER="${{ needs.create-release-pr.outputs.pr_number }}"

          echo "⏳ Waiting for PR #$PR_NUMBER to merge..."

          # Poll PR status for up to 5 minutes
          for i in {1..30}; do
            PR_STATE=$(gh pr view "$PR_NUMBER" --json state --jq '.state')

            if [[ "$PR_STATE" == "MERGED" ]]; then
              echo "✅ PR merged successfully!"
              break
            elif [[ "$PR_STATE" == "CLOSED" ]]; then
              echo "❌ PR was closed without merging"
              exit 1
            fi

            echo "   Still waiting... (attempt $i/30)"
            sleep 10
          done

      - name: Create version tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_VERSION="${{ needs.validate-staging.outputs.new_version }}"
          TAG_NAME="v${NEW_VERSION}"

          echo "📌 Creating version tag: $TAG_NAME"

          # Fetch latest main
          git fetch origin main:main
          git checkout main

          # Create annotated tag
          git tag -a "$TAG_NAME" -m "Release version $NEW_VERSION"
          git push origin "$TAG_NAME"

          echo "✅ Created and pushed tag: $TAG_NAME"

          # Create GitHub release
          gh release create "$TAG_NAME" \
            --title "emburden v${NEW_VERSION}" \
            --notes-file <(awk "/^# emburden $NEW_VERSION/,/^(# emburden|---)/ { if (\$0 !~ /^(# emburden|---)/) print }" NEWS.md) \
            --verify-tag

          echo "✅ Created GitHub release for $TAG_NAME"

      - name: Release summary
        if: always()
        run: |
          NEW_VERSION="${{ needs.validate-staging.outputs.new_version }}"
          PR_NUMBER="${{ needs.create-release-pr.outputs.pr_number }}"

          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
## ✅ Production Release Complete

**Version:** v$NEW_VERSION
**PR Number:** #$PR_NUMBER
**Status:** Merged and tagged

---

### 🎯 Next Steps (Automated)

The following workflows will now run automatically:

1. ✅ **publish-to-public.yml** - Syncing to public repo (ericscheier/emburden)
2. ⏳ **cran-release.yml** - CRAN submission (requires your final approval)

---

### 📊 Release Pipeline Status

\`\`\`
Feature → Dev → Staging → [Main] → Public Repo → CRAN
                          ^^^^^^^^
                        YOU ARE HERE
                             ↓
                      Tag: v$NEW_VERSION
                             ↓
                       GitHub Release
                             ↓
                      Public Repo Sync
                             ↓
                      CRAN Submission
\`\`\`

---

**Monitor:**
- Public repo: https://github.com/ericscheier/emburden
- CRAN workflow: Approve when ready for CRAN submission
EOF

          sed -i "s/\$NEW_VERSION/$NEW_VERSION/g" $GITHUB_STEP_SUMMARY
          sed -i "s/\$PR_NUMBER/$PR_NUMBER/g" $GITHUB_STEP_SUMMARY
